name: Package check

# Dry run only. -d is the real no-upload switch: merely leaving CF_API_KEY out
# still lets the packager cut a GitHub release. Releases are published by
# CurseForge's own packager from the tag webhook, never from here - and that
# packager differs from this one, so check its real artifact before a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Syntax-check the Lua
        run: |
          files=$(find . -name '*.lua' -not -path './.git/*')
          [ -n "$files" ] || { echo "no Lua files found"; exit 1; }
          luac5.1 -p $files

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip holds exactly the TOC, LICENSE and every file the TOC loads.
      # A missing file means the client loads nothing for it, silently; an
      # extra one means .pkgmeta's ignore list missed something.
      - name: The package is exactly the addon
        run: |
          zip=$(ls .release/*.zip | head -1)
          {
            echo "Shatter/Shatter.toc"
            echo "Shatter/LICENSE"
            tr -d '\r' < Shatter.toc | grep -v '^#' | grep -v '^[[:space:]]*$' | tr '\' '/' | sed 's#^#Shatter/#'
          } | sort > expected.txt
          unzip -Z1 "$zip" | grep -v '/$' | sort > actual.txt
          if ! diff -u expected.txt actual.txt; then
            echo "The package differs from Shatter.toc's file list (- missing, + extra)"
            exit 1
          fi

      - name: The packaged TOC is a substituted Forever TOC
        run: |
          zip=$(ls .release/*.zip | head -1)
          toc=$(unzip -p "$zip" Shatter/Shatter.toc | tr -d '\r')
          echo "$toc" | grep -qx '## Interface: 16001' || { echo "Interface is not 16001"; exit 1; }
          if echo "$toc" | grep -q '@project-version@'; then echo "Version token not substituted"; exit 1; fi

      # .release is a hidden directory, and upload-artifact@v4 skips hidden
      # content by default; without include-hidden-files it uploads nothing.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: shatter-forever-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
