name: Package check

# Dry run only. -d is the real no-upload switch: merely leaving CF_API_KEY out
# still lets the packager cut a GitHub release. Releases are published by
# CurseForge's own packager from the tag webhook, never from here - and that
# packager differs from this one, so check its real artifact before a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # The tests load LibGlass-1.0 from $LIBGLASS: the ref .pkgmeta pins,
      # proven to be that commit.
      - name: Fetch the embedded library at its pinned ref
        run: |
          bash tests/fetch_external.sh Libs/LibGlass-1.0 "$RUNNER_TEMP/LibGlass"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"

      - name: Syntax-check the Lua
        run: |
          files=$(find . -name '*.lua' -not -path './.git/*' -not -path './Libs/*')
          [ -n "$files" ] || { echo "no Lua files found"; exit 1; }
          luac5.1 -p $files

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip holds exactly the TOC, LICENSE, every Shatter file the TOC
      # loads, and LibGlass-1.0: its XML, LICENSE, the scripts its XML loads
      # and its media. A missing file means the client loads nothing for it,
      # silently; an extra one means .pkgmeta's ignore list missed something.
      - name: The package is exactly the addon and its library
        run: |
          zip=$(ls .release/*.zip | head -1)
          lib=Shatter/Libs/LibGlass-1.0
          {
            echo "Shatter/Shatter.toc"
            echo "Shatter/LICENSE"
            tr -d '\r' < Shatter.toc | grep -v '^#' | grep -v '^[[:space:]]*$' | grep -v '^Libs\\' | tr '\' '/' | sed 's#^#Shatter/#'
            echo "$lib/LibGlass-1.0.xml"
            echo "$lib/LICENSE"
            tr -d '\r' < "$LIBGLASS/LibGlass-1.0.xml" | perl -0pe 's/<!--.*?-->//gs' |
              sed -n 's/.*<Script file="\([^"]*\)".*/\1/p' | tr '\\' '/' | sed "s|^|$lib/|"
            (cd "$LIBGLASS" && ls Media/*.tga) | sed "s|^|$lib/|"
          } | sort > expected.txt
          unzip -Z1 "$zip" | grep -v '/$' | sort > actual.txt
          if ! diff -u expected.txt actual.txt; then
            echo "The package differs from the addon + library (- missing, + extra)"
            exit 1
          fi

      # The packager fetched its own copy of the library; prove it embedded the
      # pinned commit's content. Its text filter rewrites .lua/.xml with CRLF,
      # so those compare with CRs stripped; everything else byte for byte.
      - name: The packaged library is the pinned commit
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          bad=0
          lib=unpacked/Shatter/Libs/LibGlass-1.0
          while read -r f; do
            case "$f" in
              *.lua|*.xml) cmp -s <(tr -d '\r' < "$lib/$f") <(tr -d '\r' < "$LIBGLASS/$f") ;;
              *) cmp -s "$lib/$f" "$LIBGLASS/$f" ;;
            esac || { echo "LibGlass-1.0 differs from the pinned checkout: $f"; bad=1; }
          done < <(cd "$lib" && find . -type f | sed 's|^\./||')
          test "$bad" -eq 0

      - name: The packaged TOC is a substituted Forever TOC
        run: |
          zip=$(ls .release/*.zip | head -1)
          toc=$(unzip -p "$zip" Shatter/Shatter.toc | tr -d '\r')
          echo "$toc" | grep -qx '## Interface: 16001' || { echo "Interface is not 16001"; exit 1; }
          if echo "$toc" | grep -q '@project-version@'; then echo "Version token not substituted"; exit 1; fi

      # .release is a hidden directory, and upload-artifact@v4 skips hidden
      # content by default; without include-hidden-files it uploads nothing.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: shatter-forever-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
